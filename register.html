<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #52b788, #40916c);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .register-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 320px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #2d6a4f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1b4332;
        }

        .error {
            color: red;
            min-height: 20px;
        }

        .success {
            color: green;
            min-height: 20px;
        }

        a {
            text-decoration: none;
            color: #2d6a4f;
        }
    </style>
</head>
<body>

<div class="register-box">
    <h2>Create Account</h2>

    <div class="error" id="error"></div>
    <div class="success" id="success"></div>

    <form onsubmit="event.preventDefault(); registerUser();">
        <input type="text" id="username" placeholder="Username" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password (min 6 chars)" required>
        <button type="submit">Register</button>
    </form>

    <p>Already have an account? <a href="login.html">Login</a></p>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, setDoc, doc } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA8KJUDCxCt9u11xwVJAH_KkiQsVo9ojlQ",
  authDomain: "eduswap-494fe.firebaseapp.com",
  projectId: "eduswap-494fe",
  storageBucket: "eduswap-494fe.firebasestorage.app",
  messagingSenderId: "485491741775",
  appId: "1:485491741775:web:99686afbda0b44e1f9063a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.registerUser = async function() {

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    const errorDiv = document.getElementById("error");
    const successDiv = document.getElementById("success");

    errorDiv.innerText = "";
    successDiv.innerText = "";

    try {

        const userCredential = await createUserWithEmailAndPassword(auth, email, password);

        await setDoc(doc(db, "users", userCredential.user.uid), {
            username: username,
            email: email,
            createdAt: new Date()
        });

        successDiv.innerText = "Registration successful! Redirecting to login...";

        setTimeout(() => {
            window.location.href = "login.html";
        }, 2000);

    } catch (error) {
        errorDiv.innerText = error.message;
    }
}

</script>

</body>
</html>
