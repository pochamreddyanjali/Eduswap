<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #e0f7fa;
        }
        .container {
            display: flex;
            justify-content: space-around;
            margin: 20px;
        }
        .section {
            width: 45%;
            border: 2px solid #ddd;
            padding: 10px;
            border-radius: 10px;
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .item {
            border-bottom: 1px solid #ccc;
            padding: 10px;
        }
        #searchBar {
            width: 50%;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<h2>Shop - Available Items</h2>

<input type="text" id="searchBar" placeholder="Search items by name...">

<div class="container">
    <div class="section">
        <h3>Donated Items</h3>
        <div id="donatedItems"></div>
    </div>

    <div class="section">
        <h3>Items for Sale</h3>
        <div id="soldItems"></div>
    </div>
</div>

<script type="module">

import { auth } from "./firebase.js";
import { getFirestore, collection, getDocs } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

// reuse existing Firebase app
const app = getApp();
const db = getFirestore(app);

let donations = [];
let sales = [];

async function loadItems() {

    const donationSnapshot = await getDocs(collection(db, "donations"));
    donations = donationSnapshot.docs.map(doc => doc.data());

    const salesSnapshot = await getDocs(collection(db, "sales"));
    sales = salesSnapshot.docs.map(doc => doc.data());

    displayItems(donations, sales);
}

function displayItems(filteredDonations, filteredSales) {

    const donatedItemsDiv = document.getElementById("donatedItems");
    const soldItemsDiv = document.getElementById("soldItems");

    donatedItemsDiv.innerHTML = filteredDonations.length 
        ? filteredDonations.map(item => `
            <div class="item">
                <p><strong>${item.productName}</strong></p>
                <p>Brand: ${item.brand}</p>
                <p>Condition: ${item.condition}</p>
                <p>Location: ${item.location}</p>
                <p>Contact: ${item.contact}</p>
                <p>Email: ${item.email}</p>
            </div>
        `).join("")
        : "<p>No donated items available.</p>";

    soldItemsDiv.innerHTML = filteredSales.length 
        ? filteredSales.map(item => `
            <div class="item">
                <p><strong>${item.productName}</strong></p>
                <p>Brand: ${item.brand}</p>
                <p>Condition: ${item.condition}</p>
                <p>Location: ${item.location}</p>
                <p>Price: ₹${item.price}</p>
                <p>Contact: ${item.contact}</p>
                <p>Email: ${item.email}</p>
            </div>
        `).join("")
        : "<p>No items for sale.</p>";
}

document.getElementById("searchBar").addEventListener("keyup", function() {

    const searchValue = this.value.toLowerCase();

    const filteredDonations = donations.filter(item =>
        item.productName.toLowerCase().includes(searchValue)
    );

    const filteredSales = sales.filter(item =>
        item.productName.toLowerCase().includes(searchValue)
    );

    displayItems(filteredDonations, filteredSales);
});

loadItems();

</script>

</body>
</html>
