<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Search</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #f4f4f4;
    margin: 0;
    padding: 20px;
}

.top-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 90%;
    margin: auto;
    position: relative;
}

.register-link {
    position: absolute;
    right: 0;
    font-size: 16px;
    text-decoration: none;
    background-color: #007bff;
    color: white;
    padding: 10px 15px;
    border-radius: 5px;
    font-weight: bold;
}

.register-link:hover {
    background-color: #0056b3;
}

#searchBar {
    width: 50%;
    padding: 10px;
    margin-bottom: 40px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 50px;
    justify-content: center;
    max-width: 900px;
    margin: auto;
}

.box-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: black;
}

.box-wrapper:hover {
    opacity: 0.8;
}

.box {
    width: 150px;
    height: 150px;
    background-color: white;
    position: relative;
    overflow: hidden;
    transform: rotate(45deg);
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

.box::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transform: rotate(-45deg);
}

/* Skill Images */
.ai::before { background-image: url('IMAGES/ai.jpg'); }
.dbms::before { background-image: url('IMAGES/dbms.png'); }
.software::before { background-image: url('IMAGES/software engineer.webp'); }
.system::before { background-image: url('IMAGES/System_analysis.webp'); }
.web::before { background-image: url('IMAGES/web design.png'); }
.uiux::before { background-image: url('IMAGES/ui_ux.jpg'); }
.ml::before { background-image: url('IMAGES/machine learning.png'); }
.other::before { background-image: url('IMAGES/other.jpeg'); } /* Add your image */

.box-title {
    margin-top: 30px;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
}

@media (max-width: 768px) {
    .container {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 480px) {
    .container {
        grid-template-columns: repeat(1, 1fr);
    }
}
</style>
</head>

<body>

<div class="top-bar">
    <h1>Search Your Skill</h1>
    <a href="register1.html" class="register-link">Register</a>
</div>

<input type="text" id="searchBar" placeholder="Search for skills...">

<div class="container" id="skillsContainer">

    <a href="ai.html" class="box-wrapper">
        <div class="box ai"></div>
        <div class="box-title">AI</div>
    </a>

    <a href="dbms.html" class="box-wrapper">
        <div class="box dbms"></div>
        <div class="box-title">DBMS</div>
    </a>

    <a href="software.html" class="box-wrapper">
        <div class="box software"></div>
        <div class="box-title">Software Engineering</div>
    </a>

    <a href="system_analysis.html" class="box-wrapper">
        <div class="box system"></div>
        <div class="box-title">System Analysis</div>
    </a>

    <a href="web_design.html" class="box-wrapper">
        <div class="box web"></div>
        <div class="box-title">Web Design</div>
    </a>

    <a href="ui_ux.html" class="box-wrapper">
        <div class="box uiux"></div>
        <div class="box-title">UI-UX</div>
    </a>

    <a href="machine_learning.html" class="box-wrapper">
        <div class="box ml"></div>
        <div class="box-title">Machine Learning</div>
    </a>

    <!-- ✅ NEW OTHER CARD -->
    <a href="other.html" class="box-wrapper">
        <div class="box other"></div>
        <div class="box-title">Other</div>
    </a>

</div>

<script type="module">

import { auth } from "./firebase.js";
import { onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// 🔐 Protect Page
onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = "login.html";
    }
});

// 🔍 Search functionality
const searchBar = document.getElementById("searchBar");

searchBar.addEventListener("keyup", () => {
    let input = searchBar.value.toLowerCase();
    let boxes = document.querySelectorAll(".box-wrapper");

    boxes.forEach(box => {
        let title = box.querySelector(".box-title").innerText.toLowerCase();
        box.style.display = title.includes(input) ? "flex" : "none";
    });
});

</script>

</body>
</html>
