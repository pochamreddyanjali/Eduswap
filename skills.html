<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f8ff; /* Light blue background */
        }
        h1 {
            margin-top: 50px;
            color: #333;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
        }
        .box {
            width: 250px;
            height: 350px; /* Set a fixed height to ensure uniformity */
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            text-align: center;
            background-color: #f9f9f9;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* Ensure the image doesn't overflow the box */
        }
        .box img {
            width: 100%;
            height: 200px; /* Ensure the image fills the box with a fixed height */
            object-fit: cover; /* Ensures the image covers the entire area without distorting */
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .box a {
            text-decoration: none;
            font-weight: bold;
            color: #007bff;
            font-size: 16px;
        }
        .box h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>Welcome to Skills Hub</h1>

    <div class="container">
        <div class="box">
            <img src="IMAGES/shareskill.jpg" alt="Share Skill Image">
            <h3>Share a Skill</h3>
            <a href="learn_free_skills.html">Click Here</a>
        </div>
        <div class="box">
            <img src="IMAGES/sell skills.jpg" alt="Sell Skill Image">
            <h3>Sell a Skill</h3>
            <a href="sell_skill.html">Click Here</a>
        </div>
        <div class="box">
            <img src="IMAGES/getskills.jpg" alt="Get Skill Image">
            <h3>Get a Skill</h3>
            <a href="purchase_skill.html">Click Here</a>
        </div>
    </div>

</body>
</html>
