<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Expert Skill Registration</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.form-box {
    background: white;
    padding: 30px;
    width: 350px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    text-align: center;
}

input, select, textarea {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 10px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}

.error {
    color: red;
}

.popup {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #28a745;
    color: white;
    padding: 15px 20px;
    border-radius: 8px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="form-box">
    <h2>Register as Expert</h2>
    <div id="message"></div>

    <input type="text" id="name" placeholder="Your Name">

    <select id="course">
        <option value="">Select Course</option>
        <option value="AI">AI</option>
        <option value="DBMS">DBMS</option>
        <option value="Software Engineering">Software Engineering</option>
        <option value="System Analysis">System Analysis</option>
        <option value="Web Design">Web Design</option>
        <option value="UI-UX">UI-UX</option>
        <option value="Machine Learning">Machine Learning</option>
        <option value="Other">Other</option>
    </select>

    <textarea id="description" placeholder="Short Description"></textarea>

    <input type="text" id="social" placeholder="LinkedIn / Social Link">

    <button type="button" id="submitBtn">Submit</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, addDoc, collection } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA8KJUDCxCt9u11xwVJAH_KkiQsVo9ojlQ",
  authDomain: "eduswap-494fe.firebaseapp.com",
  projectId: "eduswap-494fe",
  storageBucket: "eduswap-494fe.appspot.com",
  messagingSenderId: "485491741775",
  appId: "1:485491741775:web:99686afbda0b44e1f9063a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔐 Protect Page
onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = "login.html";
    }
});

async function registerExpert() {

    const name = document.getElementById("name").value.trim();
    const course = document.getElementById("course").value;
    const description = document.getElementById("description").value.trim();
    const social = document.getElementById("social").value.trim();
    const message = document.getElementById("message");

    message.innerHTML = "";

    if (!name || !course) {
        message.innerHTML = "<p class='error'>Please fill required fields.</p>";
        return;
    }

    try {

        const user = auth.currentUser;

        if (!user) {
            message.innerHTML = "<p class='error'>User not logged in.</p>";
            return;
        }

        await addDoc(collection(db, "skills"), {
            name: name,
            course: course,
            description: description,
            social: social,
            userId: user.uid,
            createdAt: new Date()
        });

        const popup = document.createElement("div");
        popup.className = "popup";
        popup.innerText = "Registration Successful!";
        document.body.appendChild(popup);

        setTimeout(() => {

            popup.remove();

            let redirectPage = "";

            switch(course) {

                case "AI":
                    redirectPage = "ai.html";
                    break;

                case "DBMS":
                    redirectPage = "dbms.html";
                    break;

                case "Software Engineering":
                    redirectPage = "software.html";
                    break;

                case "System Analysis":
                    redirectPage = "system_analysis.html";
                    break;

                case "Web Design":
                    redirectPage = "web_design.html";
                    break;

                case "UI-UX":
                    redirectPage = "ui_ux.html";
                    break;

                case "Machine Learning":
                    redirectPage = "machine_learning.html";
                    break;

                case "Other":
                    redirectPage = "other.html";
                    break;
            }

            if (redirectPage !== "") {
                window.location.href = redirectPage;
            }

        }, 2000);

    } catch (error) {
        console.error(error);
        message.innerHTML = "<p class='error'>" + error.message + "</p>";
    }
}

document.getElementById("submitBtn")
        .addEventListener("click", registerExpert);

</script>

</body>
</html>
