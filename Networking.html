<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Networking Options</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 200px;
            flex-wrap: wrap;
        }

        .card {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background-size: cover;
            background-position: center;
            border: 7px solid;
            animation: softBorder 8s infinite linear;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card.skills {
            background-image: url('images/network_skills.avif');
        }

        .card.location {
            background-image: url('images/network_location.png');
        }

        .card.profile {
            background-image: url('images/network_profile.webp');
        }

        .card-wrapper a {
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-top: 10px;
            transition: color 0.3s ease;
        }

        .card-wrapper a:hover {
            color: #0077cc;
        }

        h1 {
            margin-top: 60px;
            font-size: 36px;
            color: #333;
        }

        @keyframes softBorder {
            0%   { border-color: #f8cdda; }
            25%  { border-color: #d5e8f6; }
            50%  { border-color: #c0f2dc; }
            75%  { border-color: #fde2e4; }
            100% { border-color: #f8cdda; }
        }
    </style>
</head>

<body>

</div>
